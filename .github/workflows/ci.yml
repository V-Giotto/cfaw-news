name: starter-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Preservation tests compare fixture bytes with earlier frozen commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check backend tests evals
      - name: Collect exact test inventory
        run: python -B -m pytest --collect-only -q -p no:cacheprovider -p evals.intelligence_g3.junit_inventory --g3-inventory .tmp/evals/g3/ci/node_inventory.json
      - run: python -B -m evals.intelligence_g3.junit_inventory --inventory .tmp/evals/g3/ci/node_inventory.json
      - run: python -B -m pytest -q -p no:cacheprovider -p evals.intelligence_g3.junit_inventory --junitxml=.tmp/evals/g3/ci/full.xml
      - run: python -B -m evals.intelligence_g3.junit_inventory --inventory .tmp/evals/g3/ci/node_inventory.json --junit .tmp/evals/g3/ci/full.xml
      - name: Offline prediction smoke (not full campaign acceptance)
        run: |
          pin=$(python -c "import hashlib,pathlib; print(hashlib.sha256(pathlib.Path('evals/intelligence_g2/manifests/pr6_ci_campaign.json').read_bytes()).hexdigest())")
          python -B -m evals.intelligence_g2.pr6.reproduce --source-commit "$GITHUB_SHA" --campaign evals/intelligence_g2/manifests/pr6_ci_campaign.json --campaign-sha256 "$pin" --out .tmp/evals/g2/ci/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-check-evidence
          path: |
            .tmp/evals/g2/ci/
            .tmp/evals/g3/ci/
      - run: python evals/run_baseline.py
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
